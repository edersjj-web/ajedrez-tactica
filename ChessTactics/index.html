<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ChessTactics</title><meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ChessTactics">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--l:#eef5ea;--d:#3f8f6b}
[data-theme=wood]{--l:#f0d9b5;--d:#b58863}[data-theme=slate]{--l:#c8cfd8;--d:#5b6b82}[data-theme=neon]{--l:#2a2f5a;--d:#14163a}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#1e2a5a,#0b1020 60%);color:#e8ecf8;min-height:100vh;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.mono{font-family:'JetBrains Mono',monospace}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
.btn{padding:.6rem 1rem;border-radius:14px;background:rgba(255,255,255,.1);font-weight:600;transition:.15s}.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(135deg,#34d399,#38bdf8);color:#04121a}
#board{container-type:inline-size;display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;touch-action:none;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px -10px #000a;width:100%}
[data-theme=neon] #board{box-shadow:0 0 30px #a855f7aa,0 0 0 2px #22d3ee}
.sq{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1}.sq.l{background:var(--l)}.sq.d{background:var(--d)}
.pc{font-size:10.4cqw;line-height:1;pointer-events:none;z-index:2}.pw{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 3px #000}.pb{color:#15151c;text-shadow:0 0 2px #fff8,0 1px 2px #fff6}
[data-theme=neon] .pw{color:#67e8f9;text-shadow:0 0 8px #22d3ee}[data-theme=neon] .pb{color:#f0abfc;text-shadow:0 0 8px #d946ef}
.sq.last{box-shadow:inset 0 0 0 100px #facc1544}.sq.sel{box-shadow:inset 0 0 0 100px #facc1588}.sq.hint{box-shadow:inset 0 0 0 4px #38bdf8,inset 0 0 0 100px #38bdf855}
.sq.chk{background-image:radial-gradient(circle,#ef4444cc,#ef444400 70%)}
.sq.dot::after{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:#0006}.sq.cap::after{content:'';position:absolute;inset:4%;border-radius:50%;border:4px solid #0006}
.ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-60%) scale(1.25);font-size:46px;line-height:1}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
nav{padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;padding:.7rem 0;font-size:.72rem;opacity:.55}nav button.on{opacity:1;color:#34d399}
.hid{display:none!important}
</style></head>
<body><div id="app" class="max-w-md mx-auto px-3 pt-[max(env(safe-area-inset-top),.75rem)] pb-28">
<section id="v-play">
 <div class="flex items-center justify-between mb-2"><div><div id="mlabel" class="font-extrabold text-lg">Carrera</div><div id="sub" class="text-xs opacity-60"></div></div>
  <div class="text-right"><div id="stat" class="mono text-xl text-emerald-300"></div></div></div>
 <div id="board"></div>
 <div class="glass p-3 mt-3"><div id="info" class="text-sm min-h-[2.5rem]"></div>
  <div class="flex flex-wrap gap-2 mt-2"><button id="bHint" class="btn">💡 Pista</button><button id="bNext" class="btn pri hid">Siguiente ➜</button><button id="bAna" class="btn hid">🔍 Analizar</button><button id="bShare" class="btn hid">📤 Compartir</button>
  <button id="bUndo" class="btn hid">◀</button><button id="bRedo" class="btn hid">▶</button><button id="bFlip" class="btn">⇅</button></div></div>
</section>
<section id="v-modes" class="hid space-y-3"><h2 class="font-extrabold text-2xl">Modos</h2>
 <button data-m="career" class="glass p-4 w-full text-left"><b>🏆 Carrera</b><div class="text-xs opacity-70">ELO adaptativo: sube y baja según aciertes.</div></button>
 <button data-m="daily" class="glass p-4 w-full text-left"><b>📅 Problema del día</b><div class="text-xs opacity-70">Uno por fecha. Comparte tu resultado.</div></button>
 <div class="grid grid-cols-2 gap-3"><button data-m="blitz" class="glass p-4 text-left"><b>⚡ Blitz 3 min</b><div class="text-xs opacity-70">Mejor: <span id="bb"></span></div></button><button data-m="surv" class="glass p-4 text-left"><b>❤️ Supervivencia</b><div class="text-xs opacity-70">3 fallos. Mejor: <span id="bs"></span></div></button></div>
 <div class="glass p-4"><b>🎯 Por temas</b><div id="themes" class="flex flex-wrap gap-2 mt-2"></div></div>
 <div class="glass p-4"><b>📋 Importar FEN / PGN</b><textarea id="fen" rows="3" class="w-full mt-2 rounded-xl bg-black/30 p-2 text-xs mono" placeholder="Pega un FEN o un PGN"></textarea><button id="bFen" class="btn pri mt-2">Analizar posición</button><div id="fenErr" class="text-xs text-rose-300 mt-1"></div></div>
</section>
<section id="v-stats" class="hid space-y-3"><h2 class="font-extrabold text-2xl">Estadísticas</h2><div id="kpis" class="grid grid-cols-2 gap-3"></div>
 <div class="glass p-3"><b class="text-sm">Evolución del ELO</b><div class="h-44"><canvas id="chart"></canvas></div></div><div class="glass p-4"><b class="text-sm">Aciertos por tema</b><div id="byTheme" class="space-y-2 mt-2"></div></div></section>
<section id="v-set" class="hid space-y-3"><h2 class="font-extrabold text-2xl">Ajustes</h2>
 <div class="glass p-4"><b>Tema del tablero</b><div id="bt" class="flex flex-wrap gap-2 mt-2"></div></div>
 <div class="glass p-4 space-y-2"><label class="flex justify-between"><span>🔊 Sonido</span><input type="checkbox" id="oSnd"></label><label class="flex justify-between"><span>📳 Vibración</span><input type="checkbox" id="oVib"></label></div>
 <div class="glass p-4"><b>💾 Copia de seguridad</b><p class="text-xs opacity-70 my-2">Haz copia antes de cada actualización.</p><div class="flex gap-2"><button id="bExp" class="btn pri">Exportar .json</button><label class="btn cursor-pointer">Importar .json<input id="fImp" type="file" accept=".json,application/json" class="hid"></label></div><div id="bmsg" class="text-xs mt-2 text-emerald-300"></div></div>
 <div class="text-center text-xs opacity-40">ChessTactics v1.0.0 · <span id="np"></span> problemas</div></section>
</div>
<nav class="fixed bottom-0 inset-x-0 glass !rounded-b-none flex max-w-md mx-auto"><button data-v="play" class="on">♟<br>Jugar</button><button data-v="modes">🎮<br>Modos</button><button data-v="stats">📊<br>Estadísticas</button><button data-v="set">⚙️<br>Ajustes</button></nav>
<div id="toast" class="fixed top-4 inset-x-0 mx-auto w-max max-w-[90%] glass px-4 py-2 text-sm hid z-50"></div>
<script type="module" src="app.js"></script></body></html>
